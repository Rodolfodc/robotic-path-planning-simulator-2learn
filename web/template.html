<title>Planejadores de Caminho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: painel de controles à esquerda (abas + parâmetros), palco à direita (gráfico + métricas).
   No celular o palco vem primeiro e os controles ficam logo abaixo. */
:root{
  --bg:#faf9f5; --surface:#ffffff; --surface-2:#f3f1ea; --fg:#141413; --muted:#6b6a64; --line:#e6e3d8;
  --accent:#c6613f; --accent-fg:#ffffff; --accent-soft:#f6e3da;
  --pf:#6a9bcc; --pf-strong:#2f6496; --as:#8a9a5b; --as-strong:#556b2f;
  --obs:#d8d4c6; --obs-line:#a8a392; --ok:#3f7d4e; --ok-soft:#e1efe3; --bad:#b3402f; --bad-soft:#f7e0db;
  --display:"Source Serif 4",Georgia,serif; --body:"DM Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#30302e; --surface-2:#3a3a37; --fg:#faf9f5; --muted:#a8a69c; --line:#454540;
  --accent:#d97757; --accent-fg:#1f1f1d; --accent-soft:#4d342b;
  --pf:#7fa9d6; --pf-strong:#a9c8ea; --as:#9aab6b; --as-strong:#c1d18f;
  --obs:#4a4a45; --obs-line:#77766c; --ok:#8cc79a; --ok-soft:#2f4536; --bad:#f09a8a; --bad-soft:#51322d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302e; --surface-2:#3a3a37; --fg:#faf9f5; --muted:#a8a69c; --line:#454540;
  --accent:#d97757; --accent-fg:#1f1f1d; --accent-soft:#4d342b;
  --pf:#7fa9d6; --pf-strong:#a9c8ea; --as:#9aab6b; --as-strong:#c1d18f;
  --obs:#4a4a45; --obs-line:#77766c; --ok:#8cc79a; --ok-soft:#2f4536; --bad:#f09a8a; --bad-soft:#51322d; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font:600 clamp(1.7rem,4vw,2.3rem)/1.15 var(--display);margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.lead{margin:0;color:var(--muted);max-width:68ch}
.layout{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stage{order:2;display:flex;flex-direction:column;gap:14px;padding:14px;min-width:0}
.panel{order:1;min-width:0;display:flex;flex-direction:column}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.stage{order:1}.panel{order:2}}

/* abas */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 0}
.tab{font:inherit;font-size:.86rem;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.dice:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pane{padding:12px 14px 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 104px auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{font-size:.9rem}
.row small{display:block;color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
input[type=number],select{width:100%;font:inherit;font-size:.9rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
input:disabled,select:disabled{opacity:.7;background:var(--surface-2);border-style:dashed}
.dice{font:inherit;font-size:.74rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.dice[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{accent-color:var(--accent);width:17px;height:17px;margin:0}
.chip{display:inline-block;font-size:.66rem;font-weight:600;letter-spacing:.03em;line-height:1;padding:3px 6px;border-radius:5px;margin-right:7px;vertical-align:1px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line)}
.chip.pf{background:color-mix(in srgb,var(--pf) 22%,transparent);border-color:var(--pf)}
.chip.astar{background:color-mix(in srgb,var(--as) 26%,transparent);border-color:var(--as)}
.chip.pid{background:var(--accent-soft);border-color:var(--accent)}
.tab .tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--obs-line)}
.tdot.pf{background:var(--pf)}.tdot.astar{background:var(--as)}.tdot.pid{background:var(--accent)}
.nota{margin:0 0 6px;font-size:.84rem;color:var(--muted)}
.row,.check{border-radius:8px}
.row:hover,.check:hover,.row:focus-within{background:var(--surface-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#tip{position:fixed;z-index:50;max-width:300px;padding:10px 12px;border-radius:10px;font-size:.82rem;line-height:1.45;
  background:var(--fg);color:var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.22);pointer-events:none;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip b{display:block;font-size:.86rem;margin-bottom:2px}
#tip em{display:block;margin-top:6px;font-style:normal;opacity:.7;font-size:.76rem}
.group{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:.88rem;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}

/* palco */
.canvas-box{width:100%;max-width:760px;margin:0 auto;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.status{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-size:.84rem;color:var(--muted)}
.status.erro{color:var(--bad)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.82rem;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:7px}
.sw{width:26px;height:0;border-top:3px solid currentColor}
.sw.tr{border-top-style:dashed;border-top-width:2px}
.tabela{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums;min-width:640px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.76rem}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:600}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.76rem;font-weight:500}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Planejadores de caminho</h1>
    <p class="lead">Compare o A* e os campos potenciais no mesmo cenário aleatório e veja como um robô com inércia, guiado por PID, segue cada caminho. Mude um parâmetro e o resultado é recalculado na hora.</p>
  </header>
  <div class="layout">
    <section class="card stage" aria-label="Resultado">
      <div class="canvas-box"><canvas id="cv" role="img" aria-label="Caminhos planejados e percorridos"></canvas></div>
      <div class="legenda" id="legenda"></div>
      <div class="status" id="status" role="status"></div>
      <div class="tabela"><table id="tabela"></table></div>
    </section>
    <section class="card panel" aria-label="Parâmetros">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div id="panes"></div>
      <div class="actions">
        <button class="btn primary" id="b-exec" type="button">Executar</button>
        <button class="btn" id="b-sort" type="button">Sortear tudo</button>
        <button class="btn" id="b-fix" type="button">Fixar valores</button>
        <button class="btn" id="b-pad" type="button">Padrões</button>
      </div>
    </section>
  </div>
</div>

<div id="tip" role="tooltip"></div>
<script>
/*ENGINE*/
</script>
<script>
(() => {
  const E = Engine;
  const reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // [chave, rótulo, padrão, dica, chip]  (item de 2 posições = título de grupo)
  const EXIBIR = [
    ["Algoritmos", null],
    ["pf", "Potential Fields", true, "Mostra o caminho do Potential Fields: o robô desce a \"ladeira\" de um campo de energia, atraído pelo objetivo e repelido pelos obstáculos.", "pf"],
    ["astar", "A*", true, "Mostra o caminho do A*: busca na grade o caminho mais barato do início ao objetivo, desviando das células bloqueadas.", "astar"],
    ["Caminhos", null],
    ["planejado", "Caminho planejado (sem PID)", true, "O que o algoritmo calculou, antes de qualquer controle. É o caminho ideal, como se o robô fosse uma partícula sem inércia. Aparece tracejado."],
    ["percorrido", "Caminho percorrido (com PID)", true, "O que um robô com massa e inércia realmente faz ao tentar seguir o caminho planejado, controlado por PIDs. Aparece contínuo."],
    ["pontos", "Pontos-alvo do seguidor", false, "Os pontos em que o caminho foi dividido. O robô aponta para um por vez e muda para o próximo ao chegar perto."],
    ["animar", "Animar o robô", !reduz, "Reproduz o percurso do robô em tempo acelerado (6x) a cada execução."],
    ["Cenário", null],
    ["obstaculos", "Obstáculos", true, "Desenha os obstáculos circulares sorteados."],
    ["influencia", "Zona de influência (rho_0)", false, "Círculo tracejado em volta de cada obstáculo até onde o Potential Fields sente a repulsão.", "pf"],
    ["grade", "Grade bloqueada do A*", false, "Células da grade que o A* trata como ocupadas: os obstáculos mais a margem de segurança.", "astar"],
  ];
  const NOMES = { pf: "Potential Fields", astar: "A*" };

  const st = { valores: {}, aleatorio: {}, exibir: {}, resultado: null, anim: null, erro: null };
  for (const [c, { padrao }] of Object.entries(E.PARAMETROS)) { st.valores[c] = padrao; st.aleatorio[c] = false; }
  for (const it of EXIBIR) if (it[1] !== null) st.exibir[it[0]] = it[2];
  const CHIPS = { cenario: "Cenário", pf: "PF", astar: "A*", pid: "PID" };
  const NOMES_ALGO = { cenario: "Cenário (os dois algoritmos)", pf: "Potential Fields", astar: "A*", pid: "Robô com PID (os dois algoritmos)" };

  const $ = (s) => document.querySelector(s);
  const campos = {}, dados = {};          // chave -> input/select ; chave -> botão aleatório

  // ---------- explicações ao passar o mouse (ou focar com o teclado) ----------
  const tip = $("#tip");
  let tipDono = null, tipTimer = null;
  function mostrar(el, titulo, texto, pertence) {
    tipDono = el;
    tip.innerHTML = `<b></b><span></span>${pertence ? "<em></em>" : ""}`;
    tip.querySelector("b").textContent = titulo;
    tip.querySelector("span").textContent = texto;
    if (pertence) tip.querySelector("em").textContent = "Pertence a: " + pertence;
    const r = el.getBoundingClientRect(), w = Math.min(300, window.innerWidth - 16);
    tip.style.maxWidth = w + "px";
    tip.classList.add("on");
    const h = tip.offsetHeight;
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    tip.style.top = top + "px";
    tip.style.left = Math.max(8, Math.min(r.left + 12, window.innerWidth - w - 8)) + "px";
  }
  function esconder(el) { if (tipDono === el) { tip.classList.remove("on"); tipDono = null; } }
  let contaDica = 0;
  function dica(el, campo, titulo, texto, pertence) {
    if (!texto) return;
    const id = "dica-" + (++contaDica);
    const sr = document.createElement("span"); sr.className = "sr"; sr.id = id; sr.textContent = texto;
    el.appendChild(sr); campo.setAttribute("aria-describedby", id);
    el.addEventListener("pointerenter", (e) => { if (e.pointerType !== "touch") mostrar(el, titulo, texto, pertence); });
    el.addEventListener("pointerleave", () => esconder(el));
    el.addEventListener("focusin", () => { mostrar(el, titulo, texto, pertence); clearTimeout(tipTimer); tipTimer = setTimeout(() => esconder(el), 6000); });
    el.addEventListener("focusout", () => esconder(el));
  }
  window.addEventListener("scroll", () => { tip.classList.remove("on"); tipDono = null; }, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { tip.classList.remove("on"); tipDono = null; } });

  // ---------- painel ----------
  const tabs = $("#tabs"), panes = $("#panes");
  const nomesAbas = ["Exibir", ...E.SECOES.map((s) => s[0])];
  nomesAbas.forEach((nome, i) => {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.role = "tab"; b.id = "tab-" + i;
    const id = i > 0 ? E.SECOES[i - 1][2].id : "";
    b.innerHTML = i > 0 ? `<i class="tdot ${id}"></i>` : "";
    b.appendChild(document.createTextNode(nome));
    b.onclick = () => abrirAba(i);
    tabs.appendChild(b);
    const p = document.createElement("div");
    p.className = "pane"; p.role = "tabpanel"; p.id = "pane-" + i; p.setAttribute("aria-labelledby", b.id);
    panes.appendChild(p);
  });
  function abrirAba(i) {
    nomesAbas.forEach((_, j) => {
      $("#tab-" + j).setAttribute("aria-selected", j === i);
      $("#pane-" + j).hidden = j !== i;
    });
  }

  // aba "Exibir"
  const paneExibir = $("#pane-0");
  for (const it of EXIBIR) {
    if (it[1] === null) { const g = document.createElement("div"); g.className = "group"; g.textContent = it[0]; paneExibir.appendChild(g); continue; }
    const l = document.createElement("label"); l.className = "check";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = it[2]; cb.id = "ex-" + it[0];
    const rot = document.createElement("span");
    if (it[4]) { const c = document.createElement("span"); c.className = "chip " + it[4]; c.textContent = CHIPS[it[4]]; rot.appendChild(c); }
    rot.appendChild(document.createTextNode(it[1]));
    dica(l, cb, it[1], it[3], it[4] ? NOMES_ALGO[it[4]] : null);
    cb.onchange = () => { st.exibir[it[0]] = cb.checked; if (it[0] === "animar") { if (cb.checked) iniciarAnimacao(); else st.anim = null; } desenhar(); tabela(); };
    l.append(cb, rot);
    paneExibir.appendChild(l);
  }

  // abas de parâmetros
  E.SECOES.forEach(([nome, ps, meta], i) => {
    const pane = $("#pane-" + (i + 1));
    const nota = document.createElement("p"); nota.className = "nota"; nota.textContent = meta.nota; pane.appendChild(nota);
    for (const [chave, rotulo, , tipo, faixa, texto] of ps) {
      const row = document.createElement("div"); row.className = "row";
      const escolha = faixa.length > 2 || tipo === "str";
      const faixaTxt = escolha ? "opções" : `faixa ${faixa[0]} a ${faixa[1]}`;
      const lab = document.createElement("label"); lab.htmlFor = "p-" + chave;
      lab.innerHTML = `<span class="chip ${meta.id}">${meta.chip}</span>${rotulo}<small>${faixaTxt}</small>`;

      let campo;
      if (escolha) {
        campo = document.createElement("select");
        for (const o of faixa) { const op = document.createElement("option"); op.value = op.textContent = String(o); campo.appendChild(op); }
      } else {
        campo = document.createElement("input"); campo.type = "number"; campo.inputMode = "decimal";
        campo.step = tipo === "int" ? "1" : (faixa[1] - faixa[0] <= 1 ? "0.01" : "0.1");
      }
      campo.id = "p-" + chave; campo.value = String(st.valores[chave]);
      campo.onchange = () => {
        let v;
        if (tipo === "str") v = campo.value;
        else if (campo.tagName === "SELECT") v = Number(campo.value);
        else v = tipo === "int" ? Math.round(campo.valueAsNumber) : campo.valueAsNumber;
        st.valores[chave] = v;
        executar(false);
      };
      campos[chave] = campo;

      const d = document.createElement("button"); d.type = "button"; d.className = "dice"; d.textContent = "aleatório";
      d.setAttribute("aria-pressed", "false"); d.title = "Sortear este parâmetro a cada execução";
      d.onclick = () => definirAleatorio(chave, !st.aleatorio[chave]);
      dados[chave] = d;
      row.append(lab, campo, d);
      dica(row, campo, rotulo, texto, NOMES_ALGO[meta.id]);
      pane.appendChild(row);
    }
  });
  function definirAleatorio(chave, on) {
    st.aleatorio[chave] = on;
    dados[chave].setAttribute("aria-pressed", on);
    campos[chave].disabled = on;
  }
  function sincronizar(chave) { campos[chave].value = String(st.valores[chave]); }
  abrirAba(0);

  // ---------- execução ----------
  function executar(sortear) {
    if (sortear) for (const c of Object.keys(st.valores)) if (st.aleatorio[c]) { st.valores[c] = E.sortear(c); sincronizar(c); }
    const p = { ...st.valores };
    if (p.raio_max < p.raio_min) {
      [p.raio_min, p.raio_max] = [p.raio_max, p.raio_min];
      st.valores.raio_min = p.raio_min; st.valores.raio_max = p.raio_max; sincronizar("raio_min"); sincronizar("raio_max");
    }
    const msg = E.validar(p);
    if (msg) { st.erro = msg; status(); return; }
    try { st.resultado = E.calcular(p); st.erro = null; }
    catch (e) { st.erro = "Erro no cálculo: " + e.message; status(); return; }
    iniciarAnimacao(); status(); legenda(); tabela(); desenhar();
  }
  $("#b-exec").onclick = () => executar(true);
  $("#b-sort").onclick = () => { for (const c of Object.keys(st.valores)) definirAleatorio(c, true); executar(true); };
  $("#b-fix").onclick = () => { for (const c of Object.keys(st.valores)) definirAleatorio(c, false); };
  $("#b-pad").onclick = () => {
    for (const [c, { padrao }] of Object.entries(E.PARAMETROS)) { st.valores[c] = padrao; sincronizar(c); definirAleatorio(c, false); }
    executar(false);
  };

  // ---------- textos ----------
  function status() {
    const s = $("#status"), r = st.resultado;
    s.className = "status" + (st.erro ? " erro" : "");
    if (st.erro) { s.textContent = st.erro; return; }
    s.innerHTML = `<span>Semente ${r.params.semente} · ${r.obstaculos.length} obstáculos</span><span>início (${r.ini.map((v) => v.toFixed(1))}) → objetivo (${r.obj.map((v) => v.toFixed(1))})</span>`;
  }
  function legenda() {
    $("#legenda").innerHTML = `<span><i class="sw tr"></i>tracejado: planejado, sem PID</span><span><i class="sw"></i>contínuo: percorrido, com PID</span>`;
  }
  const pill = (ok, sim, nao) => `<span class="pill ${ok ? "ok" : "bad"}">${ok ? sim : nao}</span>`;
  function tabela() {
    const t = $("#tabela"), r = st.resultado;
    if (!r) return;
    let h = `<thead><tr><th>Algoritmo</th><th>Planejador</th><th>L planejado</th><th>L percorrido</th><th>Erro máx.</th><th>Robô</th><th>Colisão</th><th>Plan. (ms)</th><th>Sim. (s)</th></tr></thead><tbody>`;
    for (const k of ["pf", "astar"]) {
      if (!st.exibir[k]) continue;
      const a = r.planos[k];
      h += `<tr><td><span class="dot" style="background:var(--${k === "pf" ? "pf" : "as"})"></span>${NOMES[k]}</td>
        <td>${pill(a.ok, "achou", "falhou")}</td><td>${a.lPlano.toFixed(2)}</td><td>${a.lReal.toFixed(2)}</td>
        <td>${a.erroMax.toFixed(2)}</td><td>${pill(a.chegou, "chegou", "não chegou")}</td>
        <td>${pill(!a.bateu, "não", "SIM")}</td><td>${a.tPlano.toFixed(1)}</td><td>${a.tSim.toFixed(1)}</td></tr>`;
    }
    t.innerHTML = h + "</tbody>";
    const resumo = ["pf", "astar"].filter((k) => st.exibir[k]).map((k) => `${NOMES[k]}: planejador ${r.planos[k].ok ? "achou" : "falhou"}, comprimento ${r.planos[k].lPlano.toFixed(1)}`).join("; ");
    $("#cv").setAttribute("aria-label", "Caminhos planejados e percorridos. " + resumo);
  }

  // ---------- desenho ----------
  const cv = $("#cv"), ctx = cv.getContext("2d");
  const cor = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function ajustar() {
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth;
    if (!w) return;
    cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    desenhar();
  }
  new ResizeObserver(ajustar).observe(cv);

  function iniciarAnimacao() {
    st.anim = null;
    if (!st.exibir.animar || !st.resultado) return;
    st.anim = { t0: performance.now() };
    requestAnimationFrame(passo);
  }
  function passo(agora) {
    if (!st.anim) return;
    desenhar(agora);
    const r = st.resultado, fim = Math.max(...["pf", "astar"].map((k) => r.planos[k].tSim));
    if ((agora - st.anim.t0) / 1000 * 6 >= fim) { st.anim = null; desenhar(); return; }   // 6x o tempo real
    requestAnimationFrame(passo);
  }

  function desenhar(agora) {
    const r = st.resultado, S = cv.clientWidth;
    if (!r || !S) return;
    const m = 28, esc = (S - 2 * m) / 12;
    const X = (x) => m + (x + 1) * esc, Y = (y) => S - m - (y + 1) * esc;
    const fg = cor("--fg"), muted = cor("--muted"), line = cor("--line");
    ctx.clearRect(0, 0, S, S);
    ctx.fillStyle = cor("--surface"); ctx.fillRect(0, 0, S, S);

    // grade de referência e eixos (escala única: 1 unidade = esc px)
    ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.fillStyle = muted;
    ctx.font = "11px " + cor("--body"); ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (let v = -1; v <= 11; v++) {
      ctx.globalAlpha = v % 2 === 0 ? 0.9 : 0.35;
      ctx.beginPath(); ctx.moveTo(X(v), Y(-1)); ctx.lineTo(X(v), Y(11)); ctx.moveTo(X(-1), Y(v)); ctx.lineTo(X(11), Y(v)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (let v = 0; v <= 10; v += 2) { ctx.fillText(v, X(v), S - m + 6); ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText(v, m - 6, Y(v)); ctx.textAlign = "center"; ctx.textBaseline = "top"; }
    ctx.strokeStyle = cor("--obs-line"); ctx.strokeRect(X(0), Y(10), 10 * esc, 10 * esc);

    // grade bloqueada do A*
    if (st.exibir.grade) {
      const { n, bloq } = r.grade, res = r.params.res;
      ctx.fillStyle = cor("--obs"); ctx.globalAlpha = 0.8;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (bloq[y * n + x]) ctx.fillRect(X(x * res - res / 2), Y(y * res + res / 2), res * esc, res * esc);
      ctx.globalAlpha = 1;
    }
    // obstáculos e zona de influência
    if (st.exibir.obstaculos) for (const o of r.obstaculos) {
      ctx.beginPath(); ctx.arc(X(o.c[0]), Y(o.c[1]), o.r * esc, 0, 7);
      ctx.fillStyle = cor("--obs"); ctx.fill(); ctx.strokeStyle = cor("--obs-line"); ctx.lineWidth = 1.5; ctx.setLineDash([]); ctx.stroke();
    }
    if (st.exibir.influencia) for (const o of r.obstaculos) {
      ctx.beginPath(); ctx.arc(X(o.c[0]), Y(o.c[1]), (o.r + r.params.rho_0) * esc, 0, 7);
      ctx.strokeStyle = cor("--obs-line"); ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
    }

    // caminhos
    const tempo = st.anim ? ((agora ?? performance.now()) - st.anim.t0) / 1000 * 6 : Infinity;
    for (const k of ["pf", "astar"]) {
      if (!st.exibir[k]) continue;
      const a = r.planos[k], suave = cor(k === "pf" ? "--pf" : "--as"), forte = cor(k === "pf" ? "--pf-strong" : "--as-strong");
      if (st.exibir.planejado) tracar(a.caminho, X, Y, suave, 2.2, [7, 5], a.caminho.length);
      if (st.exibir.percorrido) {
        const n = Math.min(a.traj.length, Math.floor(tempo / 0.05) + 1);
        tracar(a.traj, X, Y, forte, 2.8, [], n);
        if (st.exibir.pontos) { ctx.fillStyle = forte; for (const q of a.pontos) { ctx.beginPath(); ctx.arc(X(q[0]), Y(q[1]), 2.6, 0, 7); ctx.fill(); } }
        robo(a.traj, n, X, Y, forte, esc);
      }
    }

    // início e objetivo
    ctx.beginPath(); ctx.arc(X(r.ini[0]), Y(r.ini[1]), 7, 0, 7); ctx.fillStyle = cor("--ok"); ctx.fill();
    ctx.strokeStyle = cor("--surface"); ctx.lineWidth = 2; ctx.stroke();
    estrela(X(r.obj[0]), Y(r.obj[1]), 11, cor("--accent"));
  }
  function tracar(pts, X, Y, c, w, tracejado, n) {
    if (n < 2) return;
    ctx.beginPath(); ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
    for (let i = 1; i < n; i++) ctx.lineTo(X(pts[i][0]), Y(pts[i][1]));
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash(tracejado); ctx.lineJoin = "round"; ctx.stroke(); ctx.setLineDash([]);
  }
  function robo(pts, n, X, Y, c, esc) {            // triângulo apontando na direção do movimento
    if (n < 2) return;
    const a = pts[n - 1], b = pts[Math.max(0, n - 4)];
    const ang = Math.atan2(-(a[1] - b[1]), a[0] - b[0]);
    ctx.save(); ctx.translate(X(a[0]), Y(a[1])); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, 6); ctx.lineTo(-6, -6); ctx.closePath();
    ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = cor("--surface"); ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
  }
  function estrela(cx, cy, R, c) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const rr = i % 2 ? R * 0.45 : R, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a)); }
    ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = cor("--surface"); ctx.lineWidth = 1.5; ctx.stroke();
  }

  // redesenha ao trocar de tema
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => desenhar());
  new MutationObserver(() => desenhar()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  legenda();
  executar(false);
})();
</script>
