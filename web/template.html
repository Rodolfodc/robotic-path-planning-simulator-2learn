<title>Path Planners</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: control panel on the left (tabs + parameters), stage on the right (plot + metrics).
   On mobile the stage comes first and the controls sit right below it. */
:root{
  --bg:#faf9f5; --surface:#ffffff; --surface-2:#f3f1ea; --fg:#141413; --muted:#6b6a64; --line:#e6e3d8;
  --accent:#c6613f; --accent-fg:#ffffff; --accent-soft:#f6e3da;
  --pf:#6a9bcc; --pf-strong:#2f6496; --as:#8a9a5b; --as-strong:#556b2f;
  --obs:#d8d4c6; --obs-line:#a8a392; --ok:#3f7d4e; --ok-soft:#e1efe3; --bad:#b3402f; --bad-soft:#f7e0db;
  --display:"Source Serif 4",Georgia,serif; --body:"DM Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#30302e; --surface-2:#3a3a37; --fg:#faf9f5; --muted:#a8a69c; --line:#454540;
  --accent:#d97757; --accent-fg:#1f1f1d; --accent-soft:#4d342b;
  --pf:#7fa9d6; --pf-strong:#a9c8ea; --as:#9aab6b; --as-strong:#c1d18f;
  --obs:#4a4a45; --obs-line:#77766c; --ok:#8cc79a; --ok-soft:#2f4536; --bad:#f09a8a; --bad-soft:#51322d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302e; --surface-2:#3a3a37; --fg:#faf9f5; --muted:#a8a69c; --line:#454540;
  --accent:#d97757; --accent-fg:#1f1f1d; --accent-soft:#4d342b;
  --pf:#7fa9d6; --pf-strong:#a9c8ea; --as:#9aab6b; --as-strong:#c1d18f;
  --obs:#4a4a45; --obs-line:#77766c; --ok:#8cc79a; --ok-soft:#2f4536; --bad:#f09a8a; --bad-soft:#51322d; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font:600 clamp(1.7rem,4vw,2.3rem)/1.15 var(--display);margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.lead{margin:0;color:var(--muted);max-width:68ch}
.layout{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stage{order:2;display:flex;flex-direction:column;gap:14px;padding:14px;min-width:0}
.panel{order:1;min-width:0;display:flex;flex-direction:column}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.stage{order:1}.panel{order:2}}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 0}
.tab{font:inherit;font-size:.86rem;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.dice:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pane{padding:12px 14px 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 104px auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{font-size:.9rem}
.row small{display:block;color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
input[type=number],select{width:100%;font:inherit;font-size:.9rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
input:disabled,select:disabled{opacity:.7;background:var(--surface-2);border-style:dashed}
.dice{font:inherit;font-size:.74rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.dice[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{accent-color:var(--accent);width:17px;height:17px;margin:0}
.chip{display:inline-block;font-size:.66rem;font-weight:600;letter-spacing:.03em;line-height:1;padding:3px 6px;border-radius:5px;margin-right:7px;vertical-align:1px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line)}
.chip.pf{background:color-mix(in srgb,var(--pf) 22%,transparent);border-color:var(--pf)}
.chip.astar{background:color-mix(in srgb,var(--as) 26%,transparent);border-color:var(--as)}
.chip.pid{background:var(--accent-soft);border-color:var(--accent)}
.tab .tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--obs-line)}
.tdot.pf{background:var(--pf)}.tdot.astar{background:var(--as)}.tdot.pid{background:var(--accent)}
.note{margin:0 0 6px;font-size:.84rem;color:var(--muted)}
.row,.check{border-radius:8px}
.row:hover,.check:hover,.row:focus-within{background:var(--surface-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#tip{position:fixed;z-index:50;max-width:300px;padding:10px 12px;border-radius:10px;font-size:.82rem;line-height:1.45;
  background:var(--fg);color:var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.22);pointer-events:none;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip b{display:block;font-size:.86rem;margin-bottom:2px}
#tip em{display:block;margin-top:6px;font-style:normal;opacity:.7;font-size:.76rem}
.group{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:.88rem;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}

/* stage */
.canvas-box{width:100%;max-width:760px;margin:0 auto;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.status{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-size:.84rem;color:var(--muted)}
.status.error{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:26px;height:0;border-top:3px solid currentColor}
.sw.tr{border-top-style:dashed;border-top-width:2px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums;min-width:640px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.76rem}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:600}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.76rem;font-weight:500}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Path planners</h1>
    <p class="lead">Compare A* and potential fields on the same random scenario and see how a robot with inertia, driven by PID, follows each path. Change a parameter and the result is recomputed instantly.</p>
  </header>
  <div class="layout">
    <section class="card stage" aria-label="Result">
      <div class="canvas-box"><canvas id="cv" role="img" aria-label="Planned and driven paths"></canvas></div>
      <div class="legend" id="legend"></div>
      <div class="status" id="status" role="status"></div>
      <div class="table-wrap"><table id="table"></table></div>
    </section>
    <section class="card panel" aria-label="Parameters">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div id="panes"></div>
      <div class="actions">
        <button class="btn primary" id="b-run" type="button">Run</button>
        <button class="btn" id="b-rand" type="button">Randomize all</button>
        <button class="btn" id="b-lock" type="button">Lock values</button>
        <button class="btn" id="b-def" type="button">Defaults</button>
      </div>
    </section>
  </div>
</div>

<div id="tip" role="tooltip"></div>
<script>
/*ENGINE*/
</script>
<script>
(() => {
  const E = Engine;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // [key, label, default, hint, chip]  (2-element item = group title)
  const DISPLAY = [
    ["Algorithms", null],
    ["pf", "Potential Fields", true, "Shows the Potential Fields path: the robot goes down the \"slope\" of an energy field, attracted by the goal and repelled by the obstacles.", "pf"],
    ["astar", "A*", true, "Shows the A* path: searches the grid for the cheapest path from start to goal, avoiding blocked cells.", "astar"],
    ["Paths", null],
    ["planned", "Planned path (without PID)", true, "What the algorithm computed, before any control. It is the ideal path, as if the robot were a particle with no inertia. Drawn dashed."],
    ["driven", "Driven path (with PID)", true, "What a robot with mass and inertia actually does when trying to follow the planned path, controlled by PIDs. Drawn solid."],
    ["points", "Follower target points", false, "The points the path was split into. The robot aims at one at a time and moves to the next when it gets close."],
    ["animate", "Animate the robot", !reduceMotion, "Replays the robot's route in fast-forward (6x) on every run."],
    ["Scenario", null],
    ["obstacles", "Obstacles", true, "Draws the randomly placed circular obstacles."],
    ["influence", "Influence zone (rho_0)", false, "Dashed circle around each obstacle showing how far Potential Fields feels the repulsion.", "pf"],
    ["grid", "A* blocked grid", false, "Grid cells A* treats as occupied: the obstacles plus the safety margin.", "astar"],
  ];
  const NAMES = { pf: "Potential Fields", astar: "A*" };

  const st = { values: {}, random: {}, display: {}, result: null, anim: null, error: null };
  for (const [k, { defaultValue }] of Object.entries(E.PARAMETERS)) { st.values[k] = defaultValue; st.random[k] = false; }
  for (const it of DISPLAY) if (it[1] !== null) st.display[it[0]] = it[2];
  const CHIPS = { scenario: "Scenario", pf: "PF", astar: "A*", pid: "PID" };
  const ALGO_NAMES = { scenario: "Scenario (both algorithms)", pf: "Potential Fields", astar: "A*", pid: "Robot with PID (both algorithms)" };

  const $ = (s) => document.querySelector(s);
  const fields = {}, dice = {};          // key -> input/select ; key -> random button

  // ---------- explanations on hover (or on keyboard focus) ----------
  const tip = $("#tip");
  let tipOwner = null, tipTimer = null;
  function show(el, title, text, belongsTo) {
    tipOwner = el;
    tip.innerHTML = `<b></b><span></span>${belongsTo ? "<em></em>" : ""}`;
    tip.querySelector("b").textContent = title;
    tip.querySelector("span").textContent = text;
    if (belongsTo) tip.querySelector("em").textContent = "Belongs to: " + belongsTo;
    const r = el.getBoundingClientRect(), w = Math.min(300, window.innerWidth - 16);
    tip.style.maxWidth = w + "px";
    tip.classList.add("on");
    const h = tip.offsetHeight;
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    tip.style.top = top + "px";
    tip.style.left = Math.max(8, Math.min(r.left + 12, window.innerWidth - w - 8)) + "px";
  }
  function hide(el) { if (tipOwner === el) { tip.classList.remove("on"); tipOwner = null; } }
  let hintCount = 0;
  function hint(el, field, title, text, belongsTo) {
    if (!text) return;
    const id = "hint-" + (++hintCount);
    const sr = document.createElement("span"); sr.className = "sr"; sr.id = id; sr.textContent = text;
    el.appendChild(sr); field.setAttribute("aria-describedby", id);
    el.addEventListener("pointerenter", (e) => { if (e.pointerType !== "touch") show(el, title, text, belongsTo); });
    el.addEventListener("pointerleave", () => hide(el));
    el.addEventListener("focusin", () => { show(el, title, text, belongsTo); clearTimeout(tipTimer); tipTimer = setTimeout(() => hide(el), 6000); });
    el.addEventListener("focusout", () => hide(el));
  }
  window.addEventListener("scroll", () => { tip.classList.remove("on"); tipOwner = null; }, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { tip.classList.remove("on"); tipOwner = null; } });

  // ---------- panel ----------
  const tabs = $("#tabs"), panes = $("#panes");
  const tabNames = ["Display", ...E.SECTIONS.map((s) => s[0])];
  tabNames.forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.role = "tab"; b.id = "tab-" + i;
    const id = i > 0 ? E.SECTIONS[i - 1][2].id : "";
    b.innerHTML = i > 0 ? `<i class="tdot ${id}"></i>` : "";
    b.appendChild(document.createTextNode(name));
    b.onclick = () => openTab(i);
    tabs.appendChild(b);
    const p = document.createElement("div");
    p.className = "pane"; p.role = "tabpanel"; p.id = "pane-" + i; p.setAttribute("aria-labelledby", b.id);
    panes.appendChild(p);
  });
  function openTab(i) {
    tabNames.forEach((_, j) => {
      $("#tab-" + j).setAttribute("aria-selected", j === i);
      $("#pane-" + j).hidden = j !== i;
    });
  }

  // "Display" tab
  const displayPane = $("#pane-0");
  for (const it of DISPLAY) {
    if (it[1] === null) { const g = document.createElement("div"); g.className = "group"; g.textContent = it[0]; displayPane.appendChild(g); continue; }
    const l = document.createElement("label"); l.className = "check";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = it[2]; cb.id = "ex-" + it[0];
    const lbl = document.createElement("span");
    if (it[4]) { const c = document.createElement("span"); c.className = "chip " + it[4]; c.textContent = CHIPS[it[4]]; lbl.appendChild(c); }
    lbl.appendChild(document.createTextNode(it[1]));
    hint(l, cb, it[1], it[3], it[4] ? ALGO_NAMES[it[4]] : null);
    cb.onchange = () => { st.display[it[0]] = cb.checked; if (it[0] === "animate") { if (cb.checked) startAnimation(); else st.anim = null; } render(); table(); };
    l.append(cb, lbl);
    displayPane.appendChild(l);
  }

  // parameter tabs
  E.SECTIONS.forEach(([name, ps, meta], i) => {
    const pane = $("#pane-" + (i + 1));
    const note = document.createElement("p"); note.className = "note"; note.textContent = meta.note; pane.appendChild(note);
    for (const [key, label, , type, range, text] of ps) {
      const row = document.createElement("div"); row.className = "row";
      const choice = range.length > 2 || type === "str";
      const rangeTxt = choice ? "options" : `range ${range[0]} to ${range[1]}`;
      const lab = document.createElement("label"); lab.htmlFor = "p-" + key;
      lab.innerHTML = `<span class="chip ${meta.id}">${meta.chip}</span>${label}<small>${rangeTxt}</small>`;

      let field;
      if (choice) {
        field = document.createElement("select");
        for (const o of range) { const op = document.createElement("option"); op.value = op.textContent = String(o); field.appendChild(op); }
      } else {
        field = document.createElement("input"); field.type = "number"; field.inputMode = "decimal";
        field.step = type === "int" ? "1" : (range[1] - range[0] <= 1 ? "0.01" : "0.1");
      }
      field.id = "p-" + key; field.value = String(st.values[key]);
      field.onchange = () => {
        let v;
        if (type === "str") v = field.value;
        else if (field.tagName === "SELECT") v = Number(field.value);
        else v = type === "int" ? Math.round(field.valueAsNumber) : field.valueAsNumber;
        st.values[key] = v;
        run(false);
      };
      fields[key] = field;

      const d = document.createElement("button"); d.type = "button"; d.className = "dice"; d.textContent = "random";
      d.setAttribute("aria-pressed", "false"); d.title = "Draw this parameter on every run";
      d.onclick = () => setRandom(key, !st.random[key]);
      dice[key] = d;
      row.append(lab, field, d);
      hint(row, field, label, text, ALGO_NAMES[meta.id]);
      pane.appendChild(row);
    }
  });
  function setRandom(key, on) {
    st.random[key] = on;
    dice[key].setAttribute("aria-pressed", on);
    fields[key].disabled = on;
  }
  function sync(key) { fields[key].value = String(st.values[key]); }
  openTab(0);

  // ---------- execution ----------
  function run(drawRandom) {
    if (drawRandom) for (const k of Object.keys(st.values)) if (st.random[k]) { st.values[k] = E.draw(k); sync(k); }
    const p = { ...st.values };
    if (p.max_radius < p.min_radius) {
      [p.min_radius, p.max_radius] = [p.max_radius, p.min_radius];
      st.values.min_radius = p.min_radius; st.values.max_radius = p.max_radius; sync("min_radius"); sync("max_radius");
    }
    const msg = E.validate(p);
    if (msg) { st.error = msg; status(); return; }
    try { st.result = E.compute(p); st.error = null; }
    catch (e) { st.error = "Computation error: " + e.message; status(); return; }
    startAnimation(); status(); legend(); table(); render();
  }
  $("#b-run").onclick = () => run(true);
  $("#b-rand").onclick = () => { for (const k of Object.keys(st.values)) setRandom(k, true); run(true); };
  $("#b-lock").onclick = () => { for (const k of Object.keys(st.values)) setRandom(k, false); };
  $("#b-def").onclick = () => {
    for (const [k, { defaultValue }] of Object.entries(E.PARAMETERS)) { st.values[k] = defaultValue; sync(k); setRandom(k, false); }
    run(false);
  };

  // ---------- text ----------
  function status() {
    const s = $("#status"), r = st.result;
    s.className = "status" + (st.error ? " error" : "");
    if (st.error) { s.textContent = st.error; return; }
    s.innerHTML = `<span>Seed ${r.params.seed} · ${r.obstacles.length} obstacles</span><span>start (${r.start.map((v) => v.toFixed(1))}) → goal (${r.goal.map((v) => v.toFixed(1))})</span>`;
  }
  function legend() {
    $("#legend").innerHTML = `<span><i class="sw tr"></i>dashed: planned, without PID</span><span><i class="sw"></i>solid: driven, with PID</span>`;
  }
  const pill = (ok, yes, no) => `<span class="pill ${ok ? "ok" : "bad"}">${ok ? yes : no}</span>`;
  function table() {
    const t = $("#table"), r = st.result;
    if (!r) return;
    let h = `<thead><tr><th>Algorithm</th><th>Planner</th><th>L planned</th><th>L driven</th><th>Max error</th><th>Robot</th><th>Collision</th><th>Plan (ms)</th><th>Sim. (s)</th></tr></thead><tbody>`;
    for (const k of ["pf", "astar"]) {
      if (!st.display[k]) continue;
      const a = r.plans[k];
      h += `<tr><td><span class="dot" style="background:var(--${k === "pf" ? "pf" : "as"})"></span>${NAMES[k]}</td>
        <td>${pill(a.ok, "found", "failed")}</td><td>${a.lPlan.toFixed(2)}</td><td>${a.lReal.toFixed(2)}</td>
        <td>${a.maxError.toFixed(2)}</td><td>${pill(a.reached, "arrived", "did not arrive")}</td>
        <td>${pill(!a.hit, "no", "YES")}</td><td>${a.tPlan.toFixed(1)}</td><td>${a.tSim.toFixed(1)}</td></tr>`;
    }
    t.innerHTML = h + "</tbody>";
    const summary = ["pf", "astar"].filter((k) => st.display[k]).map((k) => `${NAMES[k]}: planner ${r.plans[k].ok ? "found a path" : "failed"}, length ${r.plans[k].lPlan.toFixed(1)}`).join("; ");
    $("#cv").setAttribute("aria-label", "Planned and driven paths. " + summary);
  }

  // ---------- drawing ----------
  const cv = $("#cv"), ctx = cv.getContext("2d");
  const color = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function resize() {
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth;
    if (!w) return;
    cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
  }
  new ResizeObserver(resize).observe(cv);

  function startAnimation() {
    st.anim = null;
    if (!st.display.animate || !st.result) return;
    st.anim = { t0: performance.now() };
    requestAnimationFrame(frame);
  }
  function frame(now) {
    if (!st.anim) return;
    render(now);
    const r = st.result, end = Math.max(...["pf", "astar"].map((k) => r.plans[k].tSim));
    if ((now - st.anim.t0) / 1000 * 6 >= end) { st.anim = null; render(); return; }   // 6x real time
    requestAnimationFrame(frame);
  }

  function render(now) {
    const r = st.result, S = cv.clientWidth;
    if (!r || !S) return;
    const m = 28, scale = (S - 2 * m) / 12;
    const X = (x) => m + (x + 1) * scale, Y = (y) => S - m - (y + 1) * scale;
    const muted = color("--muted"), line = color("--line");
    ctx.clearRect(0, 0, S, S);
    ctx.fillStyle = color("--surface"); ctx.fillRect(0, 0, S, S);

    // reference grid and axes (single scale: 1 unit = scale px)
    ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.fillStyle = muted;
    ctx.font = "11px " + color("--body"); ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (let v = -1; v <= 11; v++) {
      ctx.globalAlpha = v % 2 === 0 ? 0.9 : 0.35;
      ctx.beginPath(); ctx.moveTo(X(v), Y(-1)); ctx.lineTo(X(v), Y(11)); ctx.moveTo(X(-1), Y(v)); ctx.lineTo(X(11), Y(v)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (let v = 0; v <= 10; v += 2) { ctx.fillText(v, X(v), S - m + 6); ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText(v, m - 6, Y(v)); ctx.textAlign = "center"; ctx.textBaseline = "top"; }
    ctx.strokeStyle = color("--obs-line"); ctx.strokeRect(X(0), Y(10), 10 * scale, 10 * scale);

    // A* blocked grid
    if (st.display.grid) {
      const { n, blocked } = r.grid, res = r.params.res;
      ctx.fillStyle = color("--obs"); ctx.globalAlpha = 0.8;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (blocked[y * n + x]) ctx.fillRect(X(x * res - res / 2), Y(y * res + res / 2), res * scale, res * scale);
      ctx.globalAlpha = 1;
    }
    // obstacles and influence zone
    if (st.display.obstacles) for (const o of r.obstacles) {
      ctx.beginPath(); ctx.arc(X(o.c[0]), Y(o.c[1]), o.r * scale, 0, 7);
      ctx.fillStyle = color("--obs"); ctx.fill(); ctx.strokeStyle = color("--obs-line"); ctx.lineWidth = 1.5; ctx.setLineDash([]); ctx.stroke();
    }
    if (st.display.influence) for (const o of r.obstacles) {
      ctx.beginPath(); ctx.arc(X(o.c[0]), Y(o.c[1]), (o.r + r.params.rho_0) * scale, 0, 7);
      ctx.strokeStyle = color("--obs-line"); ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
    }

    // paths
    const time = st.anim ? ((now ?? performance.now()) - st.anim.t0) / 1000 * 6 : Infinity;
    for (const k of ["pf", "astar"]) {
      if (!st.display[k]) continue;
      const a = r.plans[k], soft = color(k === "pf" ? "--pf" : "--as"), strong = color(k === "pf" ? "--pf-strong" : "--as-strong");
      if (st.display.planned) stroke(a.path, X, Y, soft, 2.2, [7, 5], a.path.length);
      if (st.display.driven) {
        const n = Math.min(a.traj.length, Math.floor(time / 0.05) + 1);
        stroke(a.traj, X, Y, strong, 2.8, [], n);
        if (st.display.points) { ctx.fillStyle = strong; for (const q of a.points) { ctx.beginPath(); ctx.arc(X(q[0]), Y(q[1]), 2.6, 0, 7); ctx.fill(); } }
        robot(a.traj, n, X, Y, strong);
      }
    }

    // start and goal
    ctx.beginPath(); ctx.arc(X(r.start[0]), Y(r.start[1]), 7, 0, 7); ctx.fillStyle = color("--ok"); ctx.fill();
    ctx.strokeStyle = color("--surface"); ctx.lineWidth = 2; ctx.stroke();
    star(X(r.goal[0]), Y(r.goal[1]), 11, color("--accent"));
  }
  function stroke(pts, X, Y, c, w, dash, n) {
    if (n < 2) return;
    ctx.beginPath(); ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
    for (let i = 1; i < n; i++) ctx.lineTo(X(pts[i][0]), Y(pts[i][1]));
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash(dash); ctx.lineJoin = "round"; ctx.stroke(); ctx.setLineDash([]);
  }
  function robot(pts, n, X, Y, c) {                 // triangle pointing in the direction of motion
    if (n < 2) return;
    const a = pts[n - 1], b = pts[Math.max(0, n - 4)];
    const ang = Math.atan2(-(a[1] - b[1]), a[0] - b[0]);
    ctx.save(); ctx.translate(X(a[0]), Y(a[1])); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, 6); ctx.lineTo(-6, -6); ctx.closePath();
    ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = color("--surface"); ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
  }
  function star(cx, cy, R, c) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const rr = i % 2 ? R * 0.45 : R, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a)); }
    ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = color("--surface"); ctx.lineWidth = 1.5; ctx.stroke();
  }

  // redraw when the theme changes
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
  new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  legend();
  run(false);
})();
</script>
